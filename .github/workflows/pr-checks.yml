# Eval/contract layer — the PR gate (ADR-0006).
#
# `nix flake check` builds the cheap, hermetic checks (lib-shape contracts,
# the Seatbelt-profile / jail-combinator generators, the Go sandbox-proxy
# unit tests, the setup-linux fixture sims, template drv byte-equality). It
# runs natively per system so every platform's checks are actually realised,
# not just cross-evaluated.
#
# The functional layer is deliberately a SEPARATE, NON-STANDARD flake output
# (`functionalTests`, not `checks` and not `hydraJobs`), so `nix flake check`
# skips it entirely — it neither evaluates nor builds those leaves, so the PR
# gate never boots a VM and stays fast. (`hydraJobs` was tried and rejected:
# flake check's Hydra-jobset handling deep-evaluates each leaf, and the
# nixosTest machinery's closure-info derivation trips the disabled
# allow-import-from-derivation. The cosmetic "unknown flake output" warning is
# the accepted cost of keeping the functional matrix out of flake check.) The
# heavy functional matrix lives in functional.yml and runs on merge/nightly.
name: pr-checks

on:
  pull_request:
  # Also run on pushes to main so the post-merge run saves a Nix-store cache
  # under the default branch. GitHub scopes caches so a PR can restore from
  # its own branch + the default branch only — without this, each PR would
  # warm a cache no other PR can see, and new PRs would always cold-build hunk.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  # Only cancel superseded PR runs. A push to main warms the shared
  # Nix-store cache, and the slow x86_64 job saves it in a post-step — so a
  # main run must never be cancelled mid-build, or it never warms the cache
  # and every PR keeps cold-building the nvim (IFD) + hunk closures (~14m).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flake-check:
    name: nix flake check (${{ matrix.system }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runs-on: ubuntu-latest
          - system: aarch64-linux
            # GitHub-hosted arm64. Swap for a self-hosted label
            # (e.g. [self-hosted, linux, arm64]) if you run your own builder.
            runs-on: ubuntu-24.04-arm
          - system: aarch64-darwin
            runs-on: macos-14
          # x86_64-darwin (Intel) — uncomment if you still ship it.
          # - system: x86_64-darwin
          #   runs-on: macos-13
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Persist the Nix store across runs. hunk (a third-party bun2nix build)
      # is the only heavy, non-substitutable derivation the gate builds — with
      # no binary cache for it (its nix-community Cachix build is keyed to
      # hunk's own nixos-unstable, but we pin it to ours via follows), it
      # would rebuild from source (npm fetch + `bun build --compile`, ~14m on
      # ubuntu-latest) on every PR. Keying on flake.lock means code-only PRs
      # restore the full closure (hunk included) exactly; the store is only
      # rebuilt when an input pin actually moves. restore-prefixes-first-match
      # still recovers most of the store (incl. hunk, which depends on
      # flake.lock not our .nix) on a lock bump, so worst case is a partial
      # rebuild rather than a cold 14m.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ matrix.system }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ matrix.system }}-
          # GitHub gives 10 GB/repo and evicts LRU; bound what we save and
          # sweep stale caches so we don't thrash that budget.
          gc-max-store-size-linux: 5G
          gc-max-store-size-macos: 5G
          purge: true
          purge-prefixes: nix-${{ matrix.system }}-
          purge-created: 0
          purge-primary-key: never

      # Builds every derivation under `checks.${system}` for this runner's
      # system and cross-evaluates the others, failing on the first eval or
      # build regression. Does NOT touch `functionalTests` (non-standard output).
      - name: nix flake check
        run: nix flake check -L
