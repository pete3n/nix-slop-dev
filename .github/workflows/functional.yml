# Functional layer — the heavy matrix (ADR-0006).
#
# Boots real systems and exercises actual enforcement, so it does NOT gate
# PRs. It runs on merge-to-main, nightly, manual dispatch, and on release
# tags — the tag trigger is what makes "green before a release" enforceable
# via branch/tag protection requiring this workflow.
#
# Coverage:
#   nixos    — x86_64 NixOS VM oracle: Sandbox + Jail boundaries, plus the
#              exported templates' jails (template-functional). Real today.
#   distros  — Debian/Ubuntu/Fedora full end-to-end (setup-linux --apply, then
#              the oracle) in a KVM cloud-image VM. Calls ci/distro-e2e.sh.
#              Validated on real hardware; runs by default.
#   macos    — Seatbelt enforcement on a real mac, then the oracle. Calls
#              ci/macos-functional.sh. Validated on aarch64-darwin; runs by default.
#
# The distros/macos jobs are validated and run by default. Each carries a kill
# switch — a per-harness repo variable (Settings → Secrets and variables →
# Actions → Variables); set it to 'false' to disable that harness without a
# code change (useful if it goes flaky on the GitHub-hosted runner), unset or
# any other value runs it:
#   DISTRO_E2E_READY=false        — disable the distro harness
#   MACOS_FUNCTIONAL_READY=false  — disable the macOS harness
name: functional

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    # Nightly at 06:00 UTC. Bounds the window in which a functional
    # regression can sit on main between merge runs.
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: functional-${{ github.ref }}
  # Never cancel an in-flight nightly/merge/tag run — each is a full
  # coverage pass we want to complete.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nixos:
    name: NixOS VM (${{ matrix.test }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: [sandbox, wl-live-update, jail]
    steps:
      - uses: actions/checkout@v6

      # nixosTest drives QEMU under KVM. GitHub's ubuntu runners expose
      # /dev/kvm but not group-accessible by default; this is the canonical
      # opener.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: build functional test
        run: nix build -L .#functionalTests.x86_64-linux.${{ matrix.test }}

  templates:
    name: template functional
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: build template functional test
        run: nix build -L .#functionalTests.x86_64-linux.template

  distros:
    name: distro e2e (${{ matrix.distro }})
    # Validated on real KVM infra (Debian/Ubuntu/Fedora, ci/distro-e2e.sh), so
    # this runs by default on merge/nightly/tag/dispatch. Kill switch: set the
    # repo variable DISTRO_E2E_READY=false to disable (e.g. if the harness goes
    # flaky on the GitHub-hosted runner); unset or any other value runs it.
    if: vars.DISTRO_E2E_READY != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Versions tracked in README's "Tested platforms" table.
        distro: [debian, ubuntu, fedora]
    steps:
      - uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Boots a real distro VM, installs Nix, runs `setup-linux --apply`, then
      # the shared oracle. Real VMs (not containers) because invariant #3
      # (auditd violation recording) does not virtualise per-container.
      - name: distro end-to-end
        run: bash ci/distro-e2e.sh ${{ matrix.distro }}

  macos:
    name: macOS functional
    # Validated on a real mac (aarch64-darwin, ci/macos-functional.sh), so this
    # runs by default on merge/nightly/tag/dispatch. Kill switch: set the repo
    # variable MACOS_FUNCTIONAL_READY=false to disable (e.g. if it goes flaky on
    # the GitHub-hosted runner); unset or any other value runs it.
    if: vars.MACOS_FUNCTIONAL_READY != 'false'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # The mac runner IS the Darwin host — no nested VM. Builds the Darwin
      # Slop Env, stands up a loopback stub, and runs the shared oracle under
      # the sandboxed-jailed wrapper so Seatbelt actually enforces.
      - name: macOS functional
        run: bash ci/macos-functional.sh

  badges:
    name: status badges
    # Publishes per-platform functional status to the `badges` branch as
    # shields.io endpoint JSON, which the README renders. Runs after the
    # functional jobs regardless of their outcome (always()), and ONLY from
    # main — so a feature-branch dispatch can't overwrite the project's
    # canonical status. The branch is force-pushed each run (a generated
    # artifact, not history) using the workflow's own GITHUB_TOKEN — no extra
    # secret. Do not hand-edit the `badges` branch.
    needs: [nixos, templates, distros, macos]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: render + publish per-platform badge JSON
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT_NIXOS: ${{ needs.nixos.result }}
          RESULT_TEMPLATES: ${{ needs.templates.result }}
          RESULT_DISTROS: ${{ needs.distros.result }}
          RESULT_MACOS: ${{ needs.macos.result }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"

          # Map a GitHub job result to a shields.io endpoint badge body.
          emit() {
            local name="$1" result="$2" message color
            case "$result" in
              success)    message=passing;   color=brightgreen ;;
              failure)    message=failing;   color=red ;;
              cancelled)  message=cancelled; color=yellow ;;
              skipped|"") message=skipped;   color=lightgrey ;;
              *)          message="$result"; color=lightgrey ;;
            esac
            printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s"}\n' \
              "$name" "$message" "$color" >"$work/$name.json"
          }
          emit nixos     "$RESULT_NIXOS"
          emit templates "$RESULT_TEMPLATES"
          emit distros   "$RESULT_DISTROS"
          emit macos     "$RESULT_MACOS"

          # Force-push the JSON onto an orphan `badges` branch — regenerated
          # each run, so no history accumulates.
          cd "$work"
          git init -q -b badges
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "ci: update functional status badges [skip ci]"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" badges
